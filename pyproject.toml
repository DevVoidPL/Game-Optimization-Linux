[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "game-optimization-linux"
dynamic = ["version"]
description = "Per-game Linux launch profiles and Btrfs storage tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Game Optimization Linux contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.7,<7",
    "py7zr==1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
game-optimization-linux = "game_optimization_linux.main:main"
game-optimization-run = "game_optimization_linux.runner:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "game_optimization_linux.config.APP_VERSION" }

[tool.setuptools.package-data]
game_optimization_linux = [
    "py.typed",
    "qml/qmldir",
    "qml/*.qml",
    "qml/components/*.qml",
    "qml/pages/*.qml",
    "qml/pages/details/*.qml",
    "qml/dialogs/*.qml",
    "qml/couch/*.qml",
    "qml/couch/components/*.qml",
    "qml/themes/*.qml",
    "qml/resources/*",
    "resources/*",
    "resources/app-icons/*.png",
    "translations/*.ts",
    "translations/*.qm",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["game_optimization_linux"]
