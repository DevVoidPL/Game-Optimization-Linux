app-id: io.github.DevVoidPL.GameOptimizationLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: game-optimization-linux

finish-args:
  - --share=ipc
  # Required only for the built-in client of the official OptiScaler GitHub
  # releases.  The client itself rejects non-official metadata and asset URLs.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Flatpak

modules:
  # ScreenCast frames are consumed through the GStreamer PipeWire plugins from
  # the Freedesktop runtime. Tesseract is bundled, while its English model is a
  # separately managed, SHA-256 verified narrator component.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_PROG=OFF
      - -DBUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/DanBloomberg/leptonica.git
        tag: 1.86.0
        commit: dbb48b0fd0e10e943ecd9bab7439701842894733

  - name: tesseract-ocr
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/tesseract-ocr/tesseract.git
        tag: 5.5.2
        commit: 6e1d56a847e697de07b38619356550e5cf4e8633

  # py7zr validates and handles ordinary 7z releases. Official OptiScaler
  # archives may additionally use the BCJ2 filter, which py7zr deliberately
  # does not implement. Bundle the upstream standalone decoder at a fixed
  # private path; ArchiveReader invokes it only after validating every member.
  - name: sevenzip-bcj2-decoder
    buildsystem: simple
    build-commands:
      - cd CPP/7zip/Bundles/Alone2 && make -f ../../cmpl_gcc.mak -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 CPP/7zip/Bundles/Alone2/b/g/7zz ${FLATPAK_DEST}/libexec/game-optimization-7zz
    sources:
      - type: archive
        url: https://www.7-zip.org/a/7z2602-src.tar.xz
        sha256: cf967c98bca02a4b8b16375f441825a8e141362f14be1969bbec8e1ca0bff9dd
        strip-components: 0

  # Btrfs write operations run inside the sandbox against user-authorized
  # filesystem paths.  compsize remains on the narrow host measurement bridge.
  - name: btrfs-progs
    buildsystem: autotools
    config-opts:
      - --disable-documentation
      - --disable-python
      - --disable-convert
      - --disable-zoned
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/bash-completion
      - /share/zsh
    sources:
      - type: git
        url: https://kernel.googlesource.com/pub/scm/linux/kernel/git/kdave/btrfs-progs
        tag: v6.17.1
        commit: 06981428c08f78f019a2f4956407fd84b495e21e

  # The official PySide6 wheel links QtNetwork against GSSAPI. The Freedesktop
  # runtime intentionally does not ship MIT Kerberos, so provide the exact
  # runtime library instead of borrowing host libraries through the sandbox.
  - name: mit-krb5
    buildsystem: simple
    build-commands:
      - tar -xf krb5-1.22.2.tar
      - cd krb5-1.22.2/src && ./configure --prefix=${FLATPAK_DEST} --disable-static --disable-rpath --without-system-verto
      - make -C krb5-1.22.2/src -j${FLATPAK_BUILDER_N_JOBS}
      - make -C krb5-1.22.2/src install
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: file
        url: https://web.mit.edu/kerberos/dist/krb5/1.22/krb5-1.22.2.tar.gz
        # MIT serves this object with HTTP Content-Encoding: gzip. libcurl in
        # flatpak-builder verifies the decoded tar stream.
        sha256: 074de0ecf72199f091c88812d46090c27724fd36a1284b5f44bc35b8dd31a59e
        dest-filename: krb5-1.22.2.tar

  - name: python-runtime-dependencies
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-index --find-links=file://${PWD}/wheels --prefix=${FLATPAK_DEST} PySide6==6.11.1 dbus-next==0.2.3 py7zr==1.1.3 ctranslate2==4.8.1 sacremoses==0.1.1 subword-nmt==0.3.8 regex==2026.7.19 click==8.4.2 joblib==1.5.3 tqdm==4.70.0 mock==5.2.0 piper-tts==1.7.0 onnxruntime==1.28.0 numpy==2.5.2 PyYAML==6.0.3 protobuf==7.35.1 flatbuffers==25.12.19 pathvalidate==3.3.1
