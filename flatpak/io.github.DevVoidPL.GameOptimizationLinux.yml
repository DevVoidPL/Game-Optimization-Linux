  - name: game-optimization-linux
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.DevVoidPL.GameOptimizationLinux.desktop ${FLATPAK_DEST}/share/applications/io.github.DevVoidPL.GameOptimizationLinux.desktop
      - install -Dm644 data/io.github.DevVoidPL.GameOptimizationLinux.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.DevVoidPL.GameOptimizationLinux.metainfo.xml
      - install -Dm644 docs/narrator-components.md ${FLATPAK_DEST}/share/doc/game-optimization-linux/narrator-components.md
      - install -Dm755 scripts/install-game-optimization-runner.sh ${FLATPAK_DEST}/bin/game-optimization-install-runner
      - install -Dm755 libexec/game-optimization-run-host ${FLATPAK_DEST}/libexec/game-optimization-run-host
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.DevVoidPL.GameOptimizationLinux.png
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.DevVoidPL.GameOptimizationLinux.png
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/io.github.DevVoidPL.GameOptimizationLinux.png
      - install -Dm644 data/icons/hicolor/48x48/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/io.github.DevVoidPL.GameOptimizationLinux.png
      - install -Dm644 data/icons/hicolor/32x32/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/io.github.DevVoidPL.GameOptimizationLinux.png
      - install -Dm644 data/icons/hicolor/24x24/apps/io.github.DevVoidPL.GameOptimizationLinux.png ${FLATPAK_DEST}/share/icons/hicolor/24x24/apps/io.github.DevVoidPL.GameOptimizationLinux.png
