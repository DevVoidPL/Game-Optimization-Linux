  - name: gameforge-linux
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.gameforge_linux.GameForge.desktop ${FLATPAK_DEST}/share/applications/io.github.gameforge_linux.GameForge.desktop
      - install -Dm644 data/io.github.gameforge_linux.GameForge.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.gameforge_linux.GameForge.metainfo.xml
      - install -Dm755 scripts/install-gameforge-runner.sh ${FLATPAK_DEST}/bin/gameforge-install-runner
      - install -Dm755 libexec/gameforge-run-host ${FLATPAK_DEST}/libexec/gameforge-run-host
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.gameforge_linux.GameForge.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.gameforge_linux.GameForge.png
